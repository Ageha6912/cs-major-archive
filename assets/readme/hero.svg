      <stop offset="1" stop-color="#b4b8c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1d896"/>
      <stop offset="1" stop-color="#d0a44e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8eef7"/>
      <stop offset="1" stop-color="#5bd2e6"/>
