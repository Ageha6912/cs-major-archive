    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8b45c" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#d8b45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5bd2e6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5bd2e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="560" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
